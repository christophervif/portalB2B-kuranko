<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seguimiento de tu pedido — Kuranko</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--border:#e2e8f0;--txt:#0f172a;--muted:#64748b;--acc:#0ea5e9;--ok:#16a34a;--warn:#d97706;--tra:#0284c7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:18px 14px 48px}
.head{display:flex;align-items:center;gap:10px;margin:8px 0 14px}
.logo{font-weight:800;font-size:22px;letter-spacing:.5px}
.logo span{color:var(--acc)}
h1{font-size:18px;margin:14px 0 2px}
.muted{color:var(--muted)}
.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.item{display:flex;gap:12px;align-items:flex-start}
.item+.item{border-top:1px solid var(--border);margin-top:14px;padding-top:14px}
.dot{width:12px;height:12px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.d-transito{background:var(--tra)}.d-en_hub{background:var(--warn)}.d-embarcado{background:var(--acc)}.d-recibido{background:var(--ok)}.d-proceso{background:#94a3b8}
.prod{font-weight:600}
.estado{margin-top:3px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.b-transito{background:rgba(2,132,199,.12);color:var(--tra)}
.b-en_hub{background:rgba(217,119,6,.14);color:var(--warn)}
.b-embarcado{background:rgba(14,165,233,.14);color:var(--acc)}
.b-recibido{background:rgba(22,163,74,.14);color:var(--ok)}
.b-proceso{background:#f1f5f9;color:#64748b}
.eta{margin-top:4px;font-weight:600}
.foot{margin-top:18px;text-align:center}
.wa{display:inline-block;background:#25D366;color:#fff;text-decoration:none;font-weight:700;padding:10px 16px;border-radius:10px}
.load{padding:30px;text-align:center;color:var(--muted)}
.steps{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.step{flex:1;min-width:60px;text-align:center;font-size:11px;color:#94a3b8}
.step .bar{height:5px;border-radius:3px;background:#e2e8f0;margin-bottom:4px}
.step.on .bar{background:var(--acc)}
.step.on{color:var(--txt);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="logo">KU<span>RANKO</span></div></div>
  <h1>Seguimiento de tu pedido</h1>
  <div class="muted sm" id="sub">Cargando…</div>

  <div id="cont" class="load">Cargando tu pedido…</div>

  <div class="foot">
    <div class="muted sm" id="nota"></div>
    <a class="wa" id="wa" href="#" target="_blank" style="margin-top:10px">Escríbenos por WhatsApp</a>
  </div>
</div>

<script>
var WA='51904286836';
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);});}
function qp(n){try{return new URLSearchParams(location.search).get(n)||'';}catch(e){return '';}}
function fISO(d){if(!d)return '';try{var p=String(d).slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0];}catch(e){return String(d);}}
function faseKey(txt){txt=(txt||'').toLowerCase();
  if(txt.indexOf('recibido')>=0)return 'recibido';
  if(txt.indexOf('camino a per')>=0)return 'embarcado';
  if(txt.indexOf('preparando')>=0||txt.indexOf('almac')>=0&&txt.indexOf('camino al')<0)return 'en_hub';
  if(txt.indexOf('camino al')>=0)return 'transito';
  return 'proceso';}
function stepsHtml(k){
  var order=['transito','en_hub','embarcado','recibido'];
  var labels={transito:'En tránsito',en_hub:'En almacén',embarcado:'Rumbo a Perú',recibido:'Recibido'};
  if(k==='proceso')return '';
  var idx=order.indexOf(k);
  return '<div class="steps">'+order.map(function(o,i){return '<div class="step '+(i<=idx?'on':'')+'"><div class="bar"></div>'+labels[o]+'</div>';}).join('')+'</div>';
}
function badge(k,txt){
  return '<span class="badge b-'+k+'">'+esc(txt)+'</span>';
}
async function cargar(){
  var t=qp('t');
  $('wa').href='https://wa.me/'+WA+'?text='+encodeURIComponent('Hola Kuranko, quiero consultar por mi pedido.');
  if(!t){$('cont').innerHTML='<div class="card">Enlace incompleto. Pídele a Kuranko tu enlace de seguimiento.</div>';$('sub').textContent='';return;}
  try{
    var r=await fetch('/api/seg-publico/'+encodeURIComponent(t));
    var d=await r.json();
    if(!r.ok||!d.ok){throw new Error((d&&d.error)||'No se pudo cargar');}
    $('sub').textContent='Hola '+ (d.cliente||'') +' 👋 — aquí está el estado de lo que estás esperando.';
    $('nota').textContent=d.nota||'';
    var items=d.items||[];
    if(!items.length){$('cont').innerHTML='<div class="card">Por ahora no hay productos en seguimiento. Si crees que es un error, escríbenos por WhatsApp.</div>';return;}
    $('cont').innerHTML=items.map(function(it){
      var k=faseKey(it.estado);
      var eta=it.eta?('<div class="eta">📦 Llegada estimada a Perú: '+fISO(it.eta)+'</div>'):'';
      return '<div class="card"><div class="item">'+
        '<div class="dot d-'+k+'"></div>'+
        '<div style="flex:1">'+
          '<div class="prod">'+esc(it.producto||'Producto')+ (it.cantidad?(' <span class="muted sm">× '+esc(it.cantidad)+'</span>'):'') +'</div>'+
          '<div class="estado">'+badge(k,it.estado)+'</div>'+ eta +
          stepsHtml(k)+
        '</div></div></div>';
    }).join('');
    if(d.actualizado){
      var au=document.createElement('div');au.className='muted sm';au.style.textAlign='center';au.style.marginTop='6px';
      au.textContent='Última actualización: '+fISO(d.actualizado);
      $('cont').appendChild(au);
    }
  }catch(e){
    $('cont').innerHTML='<div class="card">No se pudo cargar tu seguimiento. Intenta más tarde o escríbenos por WhatsApp.</div>';
    $('sub').textContent='';
  }
}
cargar();
</script>
</body>
</html>
